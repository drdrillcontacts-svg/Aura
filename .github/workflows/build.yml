name: Build AURA
on:
  workflow_dispatch:
  push:
    branches: [ main, master, "arena/7b8be8d4-aura" ]
    paths:
      - 'Source/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build.yml'
jobs:
  windows-vst3:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build VST3
        run: cmake --build build --config Release --target AURA_VST3
      - name: Build Standalone
        run: cmake --build build --config Release --target AURA_Standalone
      - name: Package VST3 bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vst3 = Get-ChildItem -Path build -Recurse -Directory -Filter "AURA.vst3" | Select-Object -First 1
          if (-not $vst3) {
            Write-Host "AURA.vst3 bundle not found; build tree contents:"
            Get-ChildItem -Path build -Recurse -Directory | Where-Object { $_.Name -like '*VST3*' -or $_.Name -like '*artefact*' } | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          Write-Host "Packaging: $($vst3.FullName)"
          Compress-Archive -Path $vst3.FullName -DestinationPath "AURA_VST3_Windows_x86_64.zip"
      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: AURA-Windows-VST3
          path: |
            AURA_VST3_Windows_x86_64.zip
            build/AURA_artefacts/Release/VST3/
      - name: Publish GitHub Release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aura-vst3-windows-x64
          name: AURA Windows x64 VST3
          body: |
            Native Windows x64 VST3 build of AURA (planetary one-shot instrument),
            compiled with MSVC on windows-latest.

            Install: download AURA_VST3_Windows_x86_64.zip, unzip, then copy the
            `AURA.vst3` folder into your VST3 scan path (e.g.
            `C:\Program Files\Common Files\VST3\`) and rescan in your DAW.

            Build: MSVC (Visual Studio, x64), JUCE 8.0.6, CMake.
          files: AURA_VST3_Windows_x86_64.zip
          overwrite: true
          draft: false
          prerelease: false
