name: Build AURA
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'Source/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build.yml'
jobs:
  windows-vst3:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build VST3
        run: cmake --build build --config Release --target AURA_VST3
      - name: Build Standalone
        run: cmake --build build --config Release --target AURA_Standalone
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: AURA-Windows-VST3
          path: build/AURA_artefacts/Release/VST3/
      - name: Publish to aura-artifacts branch (direct download link)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 1. Package the freshly built VST3 bundle
          Compress-Archive -Path "build/AURA_artefacts/Release/VST3/AURA.vst3" -DestinationPath "$env:TEMP/AURA_VST3_Windows_x86_64.zip"
          # 2. Prepare the dedicated artifacts branch
          git config user.name "AURA CI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch --depth 1 origin aura-artifacts
          if ($LASTEXITCODE -eq 0) {
            git checkout -B aura-artifacts origin/aura-artifacts
          } else {
            git checkout --orphan aura-artifacts
            git reset
          }
          # 3. The branch contains exactly the artifact
          Get-ChildItem -Force | Where-Object { $_.Name -ne '.git' } | Remove-Item -Recurse -Force
          Copy-Item "$env:TEMP/AURA_VST3_Windows_x86_64.zip" .
          git add AURA_VST3_Windows_x86_64.zip
          git commit -m "AURA Windows x64 VST3 - MSVC CI build (run ${{ github.run_id }})"
          git push origin aura-artifacts --force
          Write-Host "Published: https://github.com/${{ github.repository }}/raw/aura-artifacts/AURA_VST3_Windows_x86_64.zip"
